[package]
name = "ai-translator-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ai-translator"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", features = ["default"] }
egui = "0.31"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
arboard = "3"
futures = "0.3"
